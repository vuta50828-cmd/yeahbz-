<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Drawing Assistant - Trợ Lý Vẽ Tranh Theo Mẫu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles & Animations -->
    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.125);
        }
        
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .glass-button:active {
            transform: scale(0.95);
        }
        .glass-button.active {
            background: rgba(99, 102, 241, 0.4);
            border-color: rgba(129, 140, 248, 0.8);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        /* Custom Range Input */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.8);
            border: 2px solid #ffffff;
        }

        /* Viewport Canvas container */
        .workspace-container {
            touch-action: none;
            user-select: none;
        }

        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Hide elements when UI is hidden */
        .ui-hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden select-none bg-slate-950 font-sans text-slate-100 flex flex-col">

    <!-- HEADER / TOP NAV BAR -->
    <header id="top-nav" class="fixed top-0 left-0 right-0 z-30 p-3 sm:p-4 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- App Title & Logo -->
            <div class="flex items-center gap-2.5 glass-panel px-4 py-2 rounded-2xl shadow-lg">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-400 text-xl"></i>
                <h1 class="font-bold text-base sm:text-lg tracking-wide bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">
                    AR Trace Studio
                </h1>
            </div>

            <!-- Header Quick Actions -->
            <div class="flex items-center gap-2">
                <!-- Toggle UI Visibility Button -->
                <button id="btn-toggle-ui" title="Ẩn/Hiện Công Cụ" class="glass-button p-2.5 rounded-2xl text-slate-200 hover:text-indigo-300 shadow-lg flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-eye text-base"></i>
                    <span class="hidden sm:inline">Ẩn giao diện</span>
                </button>

                <!-- Fullscreen Toggle -->
                <button id="btn-fullscreen" title="Toàn Màn Hình" class="glass-button p-2.5 rounded-2xl text-slate-200 hover:text-indigo-300 shadow-lg">
                    <i class="fa-solid fa-expand text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER (CAMERA + OVERLAY) -->
    <main id="workspace" class="relative flex-1 w-full h-full overflow-hidden flex items-center justify-center bg-black bg-grid-pattern workspace-container">
        
        <!-- Camera Live Feed Video Element -->
        <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover pointer-events-none" autoplay playsinline muted></video>

        <!-- Placeholder UI when image or camera is missing -->
        <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-0 bg-slate-900/80 backdrop-blur-sm">
            <div class="w-20 h-20 rounded-3xl glass-panel flex items-center justify-center text-indigo-400 mb-4 shadow-2xl animate-pulse">
                <i class="fa-solid fa-camera text-3xl"></i>
            </div>
            <h2 class="text-xl font-semibold mb-2">Chưa bật Camera hoặc chưa tải ảnh</h2>
            <p class="text-slate-400 text-sm max-w-md mb-6">Bật camera bên dưới và tải lên hình ảnh mẫu để bắt đầu can nét tranh dễ dàng trên giấy của bạn.</p>
            <div class="flex flex-wrap justify-center gap-3">
                <button id="btn-start-camera-placeholder" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-medium text-sm transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                    <i class="fa-solid fa-video"></i> Bật Camera
                </button>
                <button id="btn-upload-placeholder" class="px-5 py-2.5 rounded-xl glass-button font-medium text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-file-image"></i> Chọn Ảnh Mẫu
                </button>
            </div>
        </div>

        <!-- Tracing Overlay Wrapper (Handles Position, Transform, and Opacity) -->
        <div id="overlay-container" class="absolute z-10 origin-center cursor-move transition-opacity duration-75 hidden" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <img id="overlay-image" src="" alt="Mẫu vẽ" class="max-w-none pointer-events-none select-none rounded-lg shadow-2xl transition-all duration-100" style="filter: none;" />
            <!-- Active Selection Box / Border -->
            <div id="overlay-border" class="absolute inset-0 border-2 border-dashed border-indigo-400/70 rounded-lg pointer-events-none"></div>
        </div>

        <!-- Touch / Drag Overlay Helper Prompt (Shows briefly or when dragging) -->
        <div id="lock-indicator" class="absolute top-20 left-1/2 -translate-x-1/2 z-20 px-4 py-1.5 rounded-full glass-panel text-xs text-amber-300 font-medium hidden flex items-center gap-2 shadow-lg">
            <i class="fa-solid fa-lock"></i> Ảnh đã được khóa vị trí
        </div>
    </main>

    <!-- FLOATING CONTROL PANELS CONTAINER -->
    <div id="ui-controls-wrapper" class="fixed inset-x-0 bottom-0 z-30 p-3 sm:p-5 pointer-events-none transition-all duration-300">
        <div class="max-w-4xl mx-auto flex flex-col gap-3 pointer-events-auto">

            <!-- OPACITY & QUICK ZOOM SLIDER BAR (Always Accessible when UI is visible) -->
            <div class="glass-panel p-3 rounded-2xl shadow-2xl flex flex-col sm:flex-row items-center gap-3 sm:gap-6">
                <!-- Opacity Control -->
                <div class="flex items-center gap-3 w-full sm:w-1/2">
                    <i class="fa-solid fa-circle-half-stroke text-indigo-400 text-lg w-5 text-center"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-300 w-16">Độ mờ</span>
                    <input type="range" id="slider-opacity" min="0" max="100" value="50" class="flex-1">
                    <span id="opacity-val" class="text-xs font-mono font-bold text-indigo-300 w-10 text-right">50%</span>
                </div>

                <!-- Zoom Control -->
                <div class="flex items-center gap-3 w-full sm:w-1/2 border-t sm:border-t-0 sm:border-l border-slate-700/50 pt-2 sm:pt-0">
                    <i class="fa-solid fa-magnifying-glass text-indigo-400 text-lg w-5 text-center"></i>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-300 w-16">Tỷ lệ</span>
                    <input type="range" id="slider-zoom" min="10" max="300" value="100" class="flex-1">
                    <span id="zoom-val" class="text-xs font-mono font-bold text-indigo-300 w-10 text-right">100%</span>
                </div>
            </div>

            <!-- BOTTOM NAVIGATION TOOLBAR & TABS -->
            <div class="glass-panel p-2 sm:p-2.5 rounded-2xl shadow-2xl flex items-center justify-between gap-1 sm:gap-2 overflow-x-auto">
                
                <!-- 1. Upload File Button -->
                <label for="file-input" class="glass-button p-2.5 sm:px-4 rounded-xl text-slate-200 hover:text-indigo-300 cursor-pointer flex flex-col sm:flex-row items-center gap-1 sm:gap-2 text-xs font-medium shrink-0">
                    <i class="fa-solid fa-cloud-arrow-up text-base sm:text-lg text-indigo-400"></i>
                    <span>Tải Ảnh</span>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                </label>

                <!-- 2. Camera Controls (Toggle / Switch) -->
                <div class="flex items-center gap-1 shrink-0">
                    <button id="btn-toggle-camera" title="Bật/Tắt Camera" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-indigo-300 flex flex-col sm:flex-row items-center gap-1 sm:gap-2 text-xs font-medium">
                        <i class="fa-solid fa-video text-base sm:text-lg text-emerald-400"></i>
                        <span class="hidden md:inline">Camera</span>
                    </button>
                    <button id="btn-switch-camera" title="Đổi Camera Trước/Sau" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-indigo-300 flex items-center justify-center">
                        <i class="fa-solid fa-camera-rotate text-base sm:text-lg"></i>
                    </button>
                </div>

                <div class="h-6 w-[1px] bg-slate-700/60 shrink-0"></div>

                <!-- 3. Image Transform Tools Toggle -->
                <button id="btn-tab-transform" title="Công Cụ Chỉnh Vị Trí / Xoay" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-indigo-300 flex flex-col sm:flex-row items-center gap-1 sm:gap-2 text-xs font-medium active shrink-0">
                    <i class="fa-solid fa-up-down-left-right text-base sm:text-lg text-amber-400"></i>
                    <span>Biến Đổi</span>
                </button>

                <!-- 4. Image Filters / Contrast Modes -->
                <button id="btn-tab-filters" title="Bộ Lọc Nét Vẽ" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-indigo-300 flex flex-col sm:flex-row items-center gap-1 sm:gap-2 text-xs font-medium shrink-0">
                    <i class="fa-solid fa-wand-magic-sparkles text-base sm:text-lg text-purple-400"></i>
                    <span>Bộ Lọc</span>
                </button>

                <div class="h-6 w-[1px] bg-slate-700/60 shrink-0"></div>

                <!-- 5. Lock Overlay Position Button -->
                <button id="btn-lock" title="Khóa Vị Trí Ảnh" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-indigo-300 flex flex-col sm:flex-row items-center gap-1 sm:gap-2 text-xs font-medium shrink-0">
                    <i id="lock-icon" class="fa-solid fa-lock-open text-base sm:text-lg text-slate-400"></i>
                    <span id="lock-text" class="hidden sm:inline">Tự Do</span>
                </button>

                <!-- 6. Reset Image Transform Button -->
                <button id="btn-reset" title="Đặt Lại Ban Đầu" class="glass-button p-2.5 sm:px-3 rounded-xl text-slate-200 hover:text-rose-400 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-rotate-left text-base sm:text-lg"></i>
                </button>
            </div>

            <!-- EXPANDABLE PANEL: TRANSFORM CONTROLS -->
            <div id="panel-transform" class="glass-panel p-3.5 rounded-2xl shadow-2xl grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <!-- Rotate Left -->
                <button id="btn-rotate-ccw" class="glass-button p-2 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> Xoay Trái 90°
                </button>
                <!-- Rotate Right -->
                <button id="btn-rotate-cw" class="glass-button p-2 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Xoay Phải 90°
                </button>
                <!-- Flip Horizontal -->
                <button id="btn-flip-h" class="glass-button p-2 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-left-right"></i> Lật Ngang
                </button>
                <!-- Flip Vertical -->
                <button id="btn-flip-v" class="glass-button p-2 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-up-down"></i> Lật Dọc
                </button>
            </div>

            <!-- EXPANDABLE PANEL: FILTERS CONTROLS -->
            <div id="panel-filters" class="glass-panel p-3.5 rounded-2xl shadow-2xl flex flex-wrap gap-2 hidden">
                <button data-filter="none" class="btn-filter-option glass-button px-3 py-1.5 rounded-xl text-xs active">
                    Mặc Định
                </button>
                <button data-filter="grayscale" class="btn-filter-option glass-button px-3 py-1.5 rounded-xl text-xs">
                    Đen Trắng (Grayscale)
                </button>
                <button data-filter="invert" class="btn-filter-option glass-button px-3 py-1.5 rounded-xl text-xs">
                    Đảo Màu (Invert)
                </button>
                <button data-filter="contrast" class="btn-filter-option glass-button px-3 py-1.5 rounded-xl text-xs">
                    Tương Phản Cao
                </button>
                <button data-filter="sketch" class="btn-filter-option glass-button px-3 py-1.5 rounded-xl text-xs">
                    Tách Nét (Edge Filter)
                </button>
            </div>

        </div>
    </div>

    <!-- UI RESTORE FLOATING BUTTON (Appears when UI is hidden) -->
    <button id="btn-show-ui" class="fixed bottom-5 right-5 z-40 p-3.5 rounded-2xl glass-panel text-indigo-300 shadow-2xl hidden hover:scale-110 transition-transform">
        <i class="fa-solid fa-eye text-xl"></i>
    </button>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // --- APP STATE & VARIABLES ---
        const state = {
            cameraStream: null,
            facingMode: 'environment', // 'user' (front) or 'environment' (back)
            isCameraOn: false,
            
            // Image Transform State
            imageLoaded: false,
            opacity: 0.5,
            scale: 1.0,
            rotation: 0, // degrees
            flipH: false,
            flipV: false,
            posX: 0, // translation delta from center
            posY: 0,
            
            // Interaction State
            isLocked: false,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            initialPosX: 0,
            initialPosY: 0,
            
            // Touch Pinch Zoom & Rotate Tracking
            initialPinchDist: 0,
            initialPinchScale: 1,
            
            // Active Filter
            activeFilter: 'none',
            isUiVisible: true
        };

        // --- DOM ELEMENTS ---
        const videoElem = document.getElementById('camera-feed');
        const cameraPlaceholder = document.getElementById('camera-placeholder');
        const overlayContainer = document.getElementById('overlay-container');
        const overlayImage = document.getElementById('overlay-image');
        const overlayBorder = document.getElementById('overlay-border');
        const fileInput = document.getElementById('file-input');

        // UI Controls & Sliders
        const sliderOpacity = document.getElementById('slider-opacity');
        const opacityVal = document.getElementById('opacity-val');
        const sliderZoom = document.getElementById('slider-zoom');
        const zoomVal = document.getElementById('zoom-val');

        // Buttons
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const btnSwitchCamera = document.getElementById('btn-switch-camera');
        const btnStartCamPlaceholder = document.getElementById('btn-start-camera-placeholder');
        const btnUploadPlaceholder = document.getElementById('btn-upload-placeholder');
        const btnLock = document.getElementById('btn-lock');
        const lockIcon = document.getElementById('lock-icon');
        const lockText = document.getElementById('lock-text');
        const lockIndicator = document.getElementById('lock-indicator');
        const btnReset = document.getElementById('btn-reset');

        // Transform Buttons
        const btnRotateCcw = document.getElementById('btn-rotate-ccw');
        const btnRotateCw = document.getElementById('btn-rotate-cw');
        const btnFlipH = document.getElementById('btn-flip-h');
        const btnFlipV = document.getElementById('btn-flip-v');

        // Tabs & Panels
        const btnTabTransform = document.getElementById('btn-tab-transform');
        const btnTabFilters = document.getElementById('btn-tab-filters');
        const panelTransform = document.getElementById('panel-transform');
        const panelFilters = document.getElementById('panel-filters');

        // UI Toggle
        const topNav = document.getElementById('top-nav');
        const uiControlsWrapper = document.getElementById('ui-controls-wrapper');
        const btnToggleUi = document.getElementById('btn-toggle-ui');
        const btnShowUi = document.getElementById('btn-show-ui');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const workspace = document.getElementById('workspace');

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            setupEventListeners();
            setupDragAndGesture();
            
            // Load default sample image for instant demo experience
            loadSampleImage();
        });

        // Default demo image
        function loadSampleImage() {
            const defaultImgUrl = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80';
            setOverlayImage(defaultImgUrl);
        }

        // --- CAMERA SYSTEM ---
        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn('Camera API not supported in this browser.');
                return;
            }

            try {
                // Stop existing tracks if running
                if (state.cameraStream) {
                    state.cameraStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: state.facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };

                state.cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElem.srcObject = state.cameraStream;
                state.isCameraOn = true;
                
                // Hide placeholder
                cameraPlaceholder.classList.add('hidden');
                btnToggleCamera.querySelector('i').className = 'fa-solid fa-video text-emerald-400';
            } catch (err) {
                console.error('Error accessing camera:', err);
                state.isCameraOn = false;
                btnToggleCamera.querySelector('i').className = 'fa-solid fa-video-slash text-rose-400';
            }
        }

        function toggleCamera() {
            if (state.isCameraOn) {
                if (state.cameraStream) {
                    state.cameraStream.getTracks().forEach(track => track.stop());
                }
                videoElem.srcObject = null;
                state.isCameraOn = false;
                btnToggleCamera.querySelector('i').className = 'fa-solid fa-video-slash text-rose-400';
                if (!state.imageLoaded) cameraPlaceholder.classList.remove('hidden');
            } else {
                initCamera();
            }
        }

        function switchCamera() {
            state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }

        // --- OVERLAY & FILE HANDLING ---
        function setOverlayImage(src) {
            overlayImage.src = src;
            overlayImage.onload = () => {
                state.imageLoaded = true;
                overlayContainer.classList.remove('hidden');
                cameraPlaceholder.classList.add('hidden');
                resetTransformations();
            };
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    setOverlayImage(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        // --- TRANSFORM & RENDER LOGIC ---
        function updateOverlayTransform() {
            const scaleX = state.flipH ? -state.scale : state.scale;
            const scaleY = state.flipV ? -state.scale : state.scale;

            // Apply translation, rotation, and flip scale
            overlayContainer.style.transform = `translate(calc(-50% + ${state.posX}px), calc(-50% + ${state.posY}px)) rotate(${state.rotation}deg) scale(${scaleX}, ${scaleY})`;
            
            // Opacity
            overlayContainer.style.opacity = state.opacity;

            // Filters
            let filterCss = 'none';
            switch (state.activeFilter) {
                case 'grayscale':
                    filterCss = 'grayscale(100%) contrast(120%)';
                    break;
                case 'invert':
                    filterCss = 'invert(100%)';
                    break;
                case 'contrast':
                    filterCss = 'contrast(200%) brightness(110%)';
                    break;
                case 'sketch':
                    filterCss = 'grayscale(100%) invert(100%) contrast(500%)';
                    break;
                default:
                    filterCss = 'none';
            }
            overlayImage.style.filter = filterCss;

            // Update UI Slider text readings
            opacityVal.textContent = `${Math.round(state.opacity * 100)}%`;
            zoomVal.textContent = `${Math.round(state.scale * 100)}%`;
            sliderOpacity.value = state.opacity * 100;
            sliderZoom.value = state.scale * 100;
        }

        function resetTransformations() {
            state.scale = 1.0;
            state.rotation = 0;
            state.flipH = false;
            state.flipV = false;
            state.posX = 0;
            state.posY = 0;
            state.opacity = 0.5;
            state.activeFilter = 'none';

            // Reset filter tab UI
            document.querySelectorAll('.btn-filter-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === 'none');
            });

            updateOverlayTransform();
        }

        // --- TOUCH & DRAG EVENT HANDLERS ---
        function setupDragAndGesture() {
            // Dragging Image around screen
            const onPointerDown = (e) => {
                if (state.isLocked || !state.imageLoaded) return;
                
                // Allow dragging from workspace
                state.isDragging = true;
                state.dragStartX = e.clientX || (e.touches && e.touches[0].clientX);
                state.dragStartY = e.clientY || (e.touches && e.touches[0].clientY);
                state.initialPosX = state.posX;
                state.initialPosY = state.posY;

                // Handle multi-touch pinch
                if (e.touches && e.touches.length === 2) {
                    state.initialPinchDist = getTouchDistance(e.touches);
                    state.initialPinchScale = state.scale;
                }

                overlayBorder.classList.add('border-indigo-400');
                overlayBorder.classList.remove('border-indigo-400/70');
            };

            const onPointerMove = (e) => {
                if (!state.isDragging || state.isLocked) return;

                // Touch Pinch Zoom Check
                if (e.touches && e.touches.length === 2) {
                    const currentDist = getTouchDistance(e.touches);
                    if (state.initialPinchDist > 0) {
                        const factor = currentDist / state.initialPinchDist;
                        state.scale = Math.min(Math.max(state.initialPinchScale * factor, 0.1), 3.0);
                        updateOverlayTransform();
                    }
                    return;
                }

                // Single Pointer Translation Drag
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                const deltaX = clientX - state.dragStartX;
                const deltaY = clientY - state.dragStartY;

                state.posX = state.initialPosX + deltaX;
                state.posY = state.initialPosY + deltaY;

                updateOverlayTransform();
            };

            const onPointerUp = () => {
                state.isDragging = false;
                state.initialPinchDist = 0;
                overlayBorder.classList.remove('border-indigo-400');
                overlayBorder.classList.add('border-indigo-400/70');
            };

            // Workspace Pointer Listeners
            workspace.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            workspace.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            // Drag and Drop Image File from Desktop directly into Workspace
            workspace.addEventListener('dragover', (e) => e.preventDefault());
            workspace.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    const file = e.dataTransfer.files[0];
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (event) => setOverlayImage(event.target.result);
                        reader.readAsDataURL(file);
                    }
                }
            });
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // --- EVENT LISTENERS SETUP ---
        function setupEventListeners() {
            // Sliders
            sliderOpacity.addEventListener('input', (e) => {
                state.opacity = parseFloat(e.target.value) / 100;
                updateOverlayTransform();
            });

            sliderZoom.addEventListener('input', (e) => {
                state.scale = parseFloat(e.target.value) / 100;
                updateOverlayTransform();
            });

            // Camera Controls
            btnToggleCamera.addEventListener('click', toggleCamera);
            btnSwitchCamera.addEventListener('click', switchCamera);
            btnStartCamPlaceholder.addEventListener('click', initCamera);

            // File Uploads
            fileInput.addEventListener('change', handleFileSelect);
            btnUploadPlaceholder.addEventListener('click', () => fileInput.click());

            // Transform Actions
            btnRotateCcw.addEventListener('click', () => {
                state.rotation = (state.rotation - 90) % 360;
                updateOverlayTransform();
            });
            btnRotateCw.addEventListener('click', () => {
                state.rotation = (state.rotation + 90) % 360;
                updateOverlayTransform();
            });
            btnFlipH.addEventListener('click', () => {
                state.flipH = !state.flipH;
                updateOverlayTransform();
            });
            btnFlipV.addEventListener('click', () => {
                state.flipV = !state.flipV;
                updateOverlayTransform();
            });

            // Lock Position Toggle
            btnLock.addEventListener('click', () => {
                state.isLocked = !state.isLocked;
                if (state.isLocked) {
                    lockIcon.className = 'fa-solid fa-lock text-base sm:text-lg text-amber-400';
                    lockText.textContent = 'Đã Khóa';
                    btnLock.classList.add('active');
                    overlayBorder.classList.add('hidden');
                    lockIndicator.classList.remove('hidden');
                    setTimeout(() => lockIndicator.classList.add('hidden'), 2500);
                } else {
                    lockIcon.className = 'fa-solid fa-lock-open text-base sm:text-lg text-slate-400';
                    lockText.textContent = 'Tự Do';
                    btnLock.classList.remove('active');
                    overlayBorder.classList.remove('hidden');
                }
            });

            // Reset Transform
            btnReset.addEventListener('click', resetTransformations);

            // Tab Navigation Panels Toggle
            btnTabTransform.addEventListener('click', () => {
                btnTabTransform.classList.add('active');
                btnTabFilters.classList.remove('active');
                panelTransform.classList.remove('hidden');
                panelFilters.classList.add('hidden');
            });

            btnTabFilters.addEventListener('click', () => {
                btnTabFilters.classList.add('active');
                btnTabTransform.classList.remove('active');
                panelFilters.classList.remove('hidden');
                panelTransform.classList.add('hidden');
            });

            // Filter Options Select
            document.querySelectorAll('.btn-filter-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-filter-option').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.activeFilter = btn.dataset.filter;
                    updateOverlayTransform();
                });
            });

            // UI Hide / Show Controls
            const toggleUi = (show) => {
                state.isUiVisible = show;
                if (show) {
                    topNav.classList.remove('ui-hidden');
                    uiControlsWrapper.classList.remove('ui-hidden');
                    btnShowUi.classList.add('hidden');
                } else {
                    topNav.classList.add('ui-hidden');
                    uiControlsWrapper.classList.add('ui-hidden');
                    btnShowUi.classList.remove('hidden');
                }
            };

            btnToggleUi.addEventListener('click', () => toggleUi(false));
            btnShowUi.addEventListener('click', () => toggleUi(true));

            // Fullscreen Toggle
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.error(err));
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });
        }
    </script>
</body>
</html>
